<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSI Quiz App v3</title>
<style>
:root {
  --bg:#0b1020; --bg2:#0d1430; --panel:#121933; --panel2:#1a2345; --text:#edf2ff; --muted:#aeb8d4;
  --accent:#7aa2ff; --good:#27c281; --bad:#ff6b6b; --border:#2b376b;
}
body.light {
  --bg:#f5f7fb; --bg2:#e9eef9; --panel:#ffffff; --panel2:#eef2fb; --text:#182033; --muted:#5f6b85;
  --accent:#4b74ff; --good:#1f9d68; --bad:#d94b4b; --border:#d8dfef;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--text);
}
.wrap { max-width:980px; margin:0 auto; padding:24px; }
.card {
  background:rgba(18,25,51,.92);
  border:1px solid var(--border); border-radius:18px; padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.18); margin-top:16px;
}
body.light .card { background:rgba(255,255,255,.92); }
h1 { margin:0 0 8px; font-size:1.8rem; }
.muted { color:var(--muted); }
.controls { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); align-items:end; }
.control label { display:block; margin-bottom:6px; color:var(--muted); }
.control input,.control select {
  width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:10px 12px;
}
.row,.status,.footer { display:flex; gap:10px; flex-wrap:wrap; }
.status { gap:14px; margin-top:12px; color:var(--muted); }
button {
  background:var(--accent); color:white; border:0; padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:700;
}
button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
.question { font-size:1.25rem; line-height:1.45; margin:4px 0 18px; }
.answers { display:grid; gap:10px; }
.answer {
  border:1px solid var(--border); background:var(--panel2); border-radius:14px; padding:12px 14px;
  cursor:pointer; display:flex; gap:12px; align-items:flex-start;
}
.answer input { margin-top:4px; transform:scale(1.15); }
.answer.correct { border-color:rgba(39,194,129,.6); background:rgba(39,194,129,.12); }
.answer.wrong { border-color:rgba(255,107,107,.65); background:rgba(255,107,107,.12); }
.pill {
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 10px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); color:var(--muted);
}
.hidden { display:none; }
.progress {
  height:10px; background:var(--panel2); border-radius:999px; overflow:hidden; margin-top:10px; border:1px solid var(--border);
}
.progress > div { height:100%; width:0; background:var(--accent); transition:width .25s ease; }
.result { font-size:1.1rem; margin-top:8px; }
.small { font-size:.92rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>BSI Quiz App v3</h1>
    <div class="muted">Mit Hellmodus und Wiederholungslogik für häufig falsch beantwortete Fragen.</div>
    <div class="status">
      <span class="pill">Fragen: <strong id="totalCount"></strong></span>
      <span class="pill">Richtig: <strong id="correctCount">0</strong></span>
      <span class="pill">Falsch: <strong id="wrongCount">0</strong></span>
      <span class="pill">Offene Wiederholungen: <strong id="dueCount">0</strong></span>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <div class="control"><label for="search">Suche</label><input id="search" type="text" placeholder="Stichwort in Frage oder Antwort"></div>
      <div class="control"><label for="mode">Modus</label><select id="mode"><option value="all">Alle Fragen</option><option value="single">Nur Einfachauswahl</option><option value="multi">Nur Mehrfachauswahl</option></select></div>
      <div class="control"><label for="limit">Anzahl</label><select id="limit"><option value="0">Alle</option><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select></div>
      <div class="control"><label for="order">Reihenfolge</label><select id="order"><option value="random" selected>Zufällig</option><option value="normal">Original</option></select></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="startBtn">Quiz starten</button>
      <button class="secondary" id="restartBtn">Neu mischen</button>
      <button class="secondary" id="revealBtn">Lösung zeigen</button>
      <button class="secondary" id="themeBtn">Hellmodus</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="pill"><input type="checkbox" id="repeatWrongToggle" checked> Falsche Fragen wiederholen</label>
      <label class="pill"><input type="checkbox" id="spacedWrongToggle" checked> Wiederholung nach 3 Fragen</label>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="result" id="result"></div>
  </div>

  <div class="card">
    <div class="small muted" id="meta"></div>
    <div class="question" id="question">Klicke auf „Quiz starten“.</div>
    <div class="answers" id="answers"></div>
    <div class="footer">
      <button id="checkBtn" class="hidden">Prüfen</button>
      <button id="nextBtn" class="hidden">Nächste Frage</button>
    </div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [/* DEIN BESTEHENDES ALL_QUESTIONS ARRAY BLEIBT UNVERÄNDERT */];

const QUIZ_STATE_KEY = 'itsmQuizStateV1';
const THEME_STATE_KEY = 'quizThemeMode';

const els = {
  totalCount:document.getElementById('totalCount'),
  correctCount:document.getElementById('correctCount'),
  wrongCount:document.getElementById('wrongCount'),
  dueCount:document.getElementById('dueCount'),
  search:document.getElementById('search'),
  mode:document.getElementById('mode'),
  limit:document.getElementById('limit'),
  order:document.getElementById('order'),
  startBtn:document.getElementById('startBtn'),
  restartBtn:document.getElementById('restartBtn'),
  revealBtn:document.getElementById('revealBtn'),
  themeBtn:document.getElementById('themeBtn'),
  repeatWrongToggle:document.getElementById('repeatWrongToggle'),
  spacedWrongToggle:document.getElementById('spacedWrongToggle'),
  bar:document.getElementById('bar'),
  result:document.getElementById('result'),
  meta:document.getElementById('meta'),
  question:document.getElementById('question'),
  answers:document.getElementById('answers'),
  checkBtn:document.getElementById('checkBtn'),
  nextBtn:document.getElementById('nextBtn')
};

els.totalCount.textContent = ALL_QUESTIONS.length;

let quiz = [];
let queue = [];
let currentItem = null;
let shownCount = 0;
let correct = 0;
let wrong = 0;
let wrongStats = new Map();
let currentSelection = [];
let answerChecked = false;
let lastResultText = '';

function qKey(item) {
  return item.question + '||' + item.answers.join('||');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dueCount() {
  return queue.filter(item => {
    const s = wrongStats.get(qKey(item));
    return s && s.dueAt <= shownCount;
  }).length;
}

function clearQuizState() {
  localStorage.removeItem(QUIZ_STATE_KEY);
}

function saveQuizState() {
  const state = {
    quiz,
    queue,
    currentItem,
    shownCount,
    correct,
    wrong,
    wrongStats: Array.from(wrongStats.entries()),
    currentSelection,
    answerChecked,
    lastResultText,
    filters: {
      search: els.search.value,
      mode: els.mode.value,
      limit: els.limit.value,
      order: els.order.value,
      repeatWrong: els.repeatWrongToggle.checked,
      spacedWrong: els.spacedWrongToggle.checked
    }
  };

  localStorage.setItem(QUIZ_STATE_KEY, JSON.stringify(state));
}

function restoreQuizState() {
  const raw = localStorage.getItem(QUIZ_STATE_KEY);
  if (!raw) return false;

  try {
    const state = JSON.parse(raw);

    quiz = state.quiz || [];
    queue = state.queue || [];
    currentItem = state.currentItem || null;
    shownCount = state.shownCount || 0;
    correct = state.correct || 0;
    wrong = state.wrong || 0;
    wrongStats = new Map(state.wrongStats || []);
    currentSelection = Array.isArray(state.currentSelection) ? state.currentSelection : [];
    answerChecked = !!state.answerChecked;
    lastResultText = state.lastResultText || '';

    if (state.filters) {
      els.search.value = state.filters.search || '';
      els.mode.value = state.filters.mode || 'all';
      els.limit.value = state.filters.limit || '20';
      els.order.value = state.filters.order || 'random';
      els.repeatWrongToggle.checked = !!state.filters.repeatWrong;
      els.spacedWrongToggle.checked = !!state.filters.spacedWrong;
    }

    updateStats();

    if (currentItem) {
      renderQuestion();
      if (answerChecked) {
        markAnswers(true);
        els.checkBtn.classList.add('hidden');
        els.nextBtn.classList.remove('hidden');
        els.result.textContent = lastResultText || 'Gespeicherter Stand wiederhergestellt.';
      } else {
        els.result.textContent = 'Gespeicherter Stand wiederhergestellt.';
      }
      return true;
    }

    if (queue.length) {
      nextQuestion();
      return true;
    }

    if (quiz.length || correct || wrong) {
      showFinishedState();
      return true;
    }

    return false;
  } catch {
    clearQuizState();
    return false;
  }
}

function buildQuiz() {
  clearQuizState();

  const q = els.search.value.trim().toLowerCase();
  const mode = els.mode.value;
  const limit = Number(els.limit.value);
  const order = els.order.value;

  let filtered = ALL_QUESTIONS.filter(item => {
    const text = (item.question + ' ' + item.answers.join(' ')).toLowerCase();
    const matchText = !q || text.includes(q);
    const multi = item.solution.filter(Boolean).length > 1;
    const matchMode =
      mode === 'all' ||
      (mode === 'single' && !multi) ||
      (mode === 'multi' && multi);
    return matchText && matchMode;
  });

  if (order === 'random') filtered = shuffle(filtered);
  if (limit > 0) filtered = filtered.slice(0, limit);

  quiz = filtered;
  queue = [...filtered];
  currentItem = null;
  shownCount = 0;
  correct = 0;
  wrong = 0;
  wrongStats = new Map();
  currentSelection = [];
  answerChecked = false;
  lastResultText = '';

  updateStats();

  if (!quiz.length) {
    els.question.textContent = 'Keine passenden Fragen gefunden.';
    els.answers.innerHTML = '';
    els.meta.textContent = '';
    els.result.textContent = '';
    els.checkBtn.classList.add('hidden');
    els.nextBtn.classList.add('hidden');
    els.bar.style.width = '0%';
    clearQuizState();
    return;
  }

  nextQuestion();
}

function updateStats() {
  els.correctCount.textContent = correct;
  els.wrongCount.textContent = wrong;
  els.dueCount.textContent = dueCount();
  const answered = correct + wrong;
  const total = Math.max(answered + queue.length + (currentItem ? 1 : 0), 1);
  els.bar.style.width = ((answered / total) * 100) + '%';
}

function getCorrectIndices(item) {
  return item.solution.map((v, i) => v ? i : -1).filter(v => v >= 0);
}

function applySelection() {
  const selectedSet = new Set(currentSelection);
  Array.from(els.answers.querySelectorAll('input')).forEach(input => {
    input.checked = selectedSet.has(Number(input.value));
  });
}

function syncCurrentSelectionFromUi() {
  currentSelection = Array.from(
    els.answers.querySelectorAll('input:checked')
  )
    .map(el => Number(el.value))
    .sort((a, b) => a - b);

  saveQuizState();
}

function renderQuestion() {
  const item = currentItem;
  const isMulti = item.solution.filter(Boolean).length > 1;
  const stats = wrongStats.get(qKey(item));
  const wrongText = stats ? ` · bisher falsch: ${stats.count}×` : '';

  els.meta.textContent = `Frage ${shownCount} · ${isMulti ? 'Mehrfachauswahl' : 'Einfachauswahl'}${wrongText}`;
  els.question.textContent = item.question;
  els.answers.innerHTML = '';
  els.result.textContent = lastResultText || '';
  els.checkBtn.classList.toggle('hidden', answerChecked);
  els.nextBtn.classList.toggle('hidden', !answerChecked);

  item.answers.forEach((answer, i) => {
    const wrap = document.createElement('label');
    wrap.className = 'answer';

    const input = document.createElement('input');
    input.type = isMulti ? 'checkbox' : 'radio';
    input.name = 'answer';
    input.value = String(i);

    input.addEventListener('change', syncCurrentSelectionFromUi);

    const span = document.createElement('div');
    span.textContent = answer;

    wrap.appendChild(input);
    wrap.appendChild(span);
    els.answers.appendChild(wrap);
  });

  applySelection();

  if (answerChecked) {
    markAnswers(true);
  }
}

function selected() {
  return Array.from(els.answers.querySelectorAll('input:checked'))
    .map(el => Number(el.value))
    .sort((a, b) => a - b);
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function markAnswers(showWrong = true) {
  const item = currentItem;
  const c = new Set(getCorrectIndices(item));

  Array.from(els.answers.children).forEach((label, i) => {
    label.classList.remove('correct', 'wrong');
    if (c.has(i)) label.classList.add('correct');

    const input = label.querySelector('input');
    if (showWrong && input.checked && !c.has(i)) {
      label.classList.add('wrong');
    }
  });
}

function checkAnswer(revealOnly = false) {
  if (!currentItem) return;

  const item = currentItem;
  const sel = selected();
  const corr = getCorrectIndices(item);

  currentSelection = sel;
  markAnswers(true);
  answerChecked = true;
  els.checkBtn.classList.add('hidden');
  els.nextBtn.classList.remove('hidden');

  if (revealOnly) {
    lastResultText = 'Lösung eingeblendet.';
    els.result.textContent = lastResultText;
    saveQuizState();
    return;
  }

  const key = qKey(item);

  if (arraysEqual(sel, corr)) {
    correct++;
    lastResultText = 'Richtig.';
    els.result.textContent = lastResultText;
  } else {
    wrong++;
    const prev = wrongStats.get(key) || { count: 0, dueAt: 0 };
    const nextDue = shownCount + (els.spacedWrongToggle.checked ? 3 : 1);
    wrongStats.set(key, { count: prev.count + 1, dueAt: nextDue });

    if (els.repeatWrongToggle.checked) {
      queue.push(item);
    }

    lastResultText = `Nicht ganz. Richtig ist: ${corr.map(i => i + 1).join(', ')}. Diese Frage wird später wiederholt.`;
    els.result.textContent = lastResultText;
  }

  updateStats();
  saveQuizState();
}

function showFinishedState() {
  els.meta.textContent = `Fertig · ${correct + wrong} beantwortet`;
  els.question.textContent = 'Quiz beendet.';
  els.answers.innerHTML = '';
  els.checkBtn.classList.add('hidden');
  els.nextBtn.classList.add('hidden');

  const total = correct + wrong;
  const score = total ? Math.round((correct / total) * 100) : 0;
  els.result.textContent = `Ergebnis: ${correct} richtig, ${wrong} falsch · ${score}%`;

  currentItem = null;
  currentSelection = [];
  answerChecked = false;
  lastResultText = els.result.textContent;

  updateStats();
  saveQuizState();
}

function nextQuestion() {
  if (!queue.length) {
    showFinishedState();
    return;
  }

  let nextIndex = 0;

  if (els.repeatWrongToggle.checked) {
    const dueIndex = queue.findIndex(item => {
      const s = wrongStats.get(qKey(item));
      return s && s.dueAt <= shownCount;
    });

    if (dueIndex >= 0) nextIndex = dueIndex;
  }

  currentItem = queue.splice(nextIndex, 1)[0];
  shownCount++;
  currentSelection = [];
  answerChecked = false;
  lastResultText = '';

  updateStats();
  renderQuestion();
  saveQuizState();
}

function applyTheme(mode) {
  document.body.classList.toggle('light', mode === 'light');
  els.themeBtn.textContent = mode === 'light' ? 'Dunkelmodus' : 'Hellmodus';
  localStorage.setItem(THEME_STATE_KEY, mode);
}

const savedTheme = localStorage.getItem(THEME_STATE_KEY) || 'dark';
applyTheme(savedTheme);
restoreQuizState();

els.startBtn.addEventListener('click', buildQuiz);
els.restartBtn.addEventListener('click', buildQuiz);
els.revealBtn.addEventListener('click', () => {
  if (currentItem) checkAnswer(true);
});
els.checkBtn.addEventListener('click', () => checkAnswer(false));
els.nextBtn.addEventListener('click', nextQuestion);
els.themeBtn.addEventListener('click', () => {
  const next = document.body.classList.contains('light') ? 'dark' : 'light';
  applyTheme(next);
});
</script>
</body>
</html>
